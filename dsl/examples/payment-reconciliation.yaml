# ============================================================================
# Payment Gateway Reconciliation - Complete Example
# Version: 2.0
# ============================================================================
# Business Scenario:
#   Reconcile internal payment ledger against payment gateway settlement
#   reports to ensure all transactions are captured correctly.
#
# Data Sources:
#   - Internal Ledger (PostgreSQL database - only PostgreSQL supported)
#   - Payment Gateway (REST API)
#
# Matching Logic:
#   - Join on transaction_id (equality only)
#   - Amount must match within $0.05 (gateway may round) - Lua script
#   - Currency must match exactly
#   - Fee validation (warning level) - Lua script
#   - Timestamp should be within 10 minutes (warning level) - Lua script
#
# Version 2.0 Changes:
#   - Simplified matching rules (JOIN + WHERE pattern)
#   - All transformations use Lua
#   - CSV exports only
#   - UTC-only timestamps
#   - Named queries for match groups
# ============================================================================

---
# Data Source: Internal Ledger (PostgreSQL)
datasource:
  name: internal_ledger
  type: database
  version: 1
  description: "Internal transaction ledger (PostgreSQL)"

  connection:
    database_type: postgresql  # Only PostgreSQL supported
    host: ledger-db.company.com
    port: 5432
    database: ledger
    schema: public
    username: recon_readonly
    password: ${SECRET:ledger_db_password}
    ssl_enabled: true

  # IMPORTANT: All timestamps must be in UTC
  query_template: |
    SELECT
      transaction_id,
      merchant_id,
      transaction_type,
      amount,
      currency,
      fee_amount,
      status,
      created_at,  -- UTC timestamp
      updated_at   -- UTC timestamp
    FROM transactions
    WHERE DATE(created_at AT TIME ZONE 'UTC') = '{year}-{month}-{day}'
      AND status IN ('COMPLETED', 'SETTLED')
    ORDER BY transaction_id

  format:
    type: tabular

  metadata:
    owner: data_team@company.com

---
# Data Source: Payment Gateway API
datasource:
  name: payment_gateway_api
  type: api
  version: 1
  description: "Payment gateway REST API"

  connection:
    base_url: https://api.paymentgateway.com
    endpoint: /v2/settlements
    method: GET
    auth_type: bearer
    auth_credentials:
      token: ${SECRET:gateway_api_token}

    query_params:
      settlement_date: "{year}-{month}-{day}"
      format: json

    timeout_seconds: 60

  pagination:
    type: cursor
    page_size: 1000
    cursor_param: next_token
    next_cursor_field: pagination.next_token

  rate_limit:
    requests_per_second: 20
    retry_on_429: true

  response:
    data_path: data.settlements

  format:
    type: json

  metadata:
    owner: integrations_team@company.com

---
# Schema: Normalized Payment Transaction (Version 2.0 - Lua transformations)
schema:
  name: payment_transaction_schema
  version: 2
  description: "Normalized payment transaction schema with Lua transformations"

  fields:
    # Simple field mappings
    - name: transaction_id
      type: string
      required: true

    - name: merchant_id
      type: string
      required: true

    # Type conversion with Lua
    - name: amount
      type: decimal
      precision: 19
      scale: 4
      required: true
      transform: "tonumber(value)"

    - name: currency
      type: string
      required: true

    # Type conversion with Lua, default handling
    - name: fee_amount
      type: decimal
      precision: 19
      scale: 4
      required: false
      transform: |
        if value == nil or value == "" then
          return 0.00
        end
        return tonumber(value)

    # Derived field - Lua calculation
    - name: net_amount
      type: decimal
      precision: 19
      scale: 4
      required: false
      transform: "row.amount - row.fee_amount"

    # Enum mapping with Lua
    - name: status
      type: string
      required: true
      transform: |
        local v = string.upper(value or "")
        if v == "SUCCESS" or v == "OK" or v == "SETTLED" then
          return "COMPLETED"
        elseif v == "FAILED" or v == "ERROR" then
          return "REJECTED"
        elseif v == "PENDING" or v == "PROCESSING" then
          return "IN_PROGRESS"
        else
          return "UNKNOWN"
        end

    # Timestamp parsing with Lua
    - name: transaction_timestamp
      type: timestamp
      required: true
      timezone: UTC  # Only UTC supported
      transform: |
        -- Parse ISO 8601 timestamp
        return parse_timestamp(value, "YYYY-MM-DDTHH:mm:ss.SSSZ")

---
# Source Mapping: Internal Ledger
source_mapping:
  schema_ref: payment_transaction_schema:2
  source_name: internal_ledger

  field_mappings:
    transaction_id: transaction_id
    merchant_id: merchant_id
    amount: amount
    currency: currency
    fee_amount: fee_amount
    status: status
    created_at: transaction_timestamp

---
# Source Mapping: Payment Gateway
source_mapping:
  schema_ref: payment_transaction_schema:2
  source_name: payment_gateway_api

  field_mappings:
    txn_id: transaction_id
    merchant_ref: merchant_id
    txn_amount: amount
    txn_currency: currency
    gateway_fee: fee_amount
    txn_status: status
    created_at: transaction_timestamp

---
# Matching Rules (Version 2.0 - JOIN + WHERE pattern)
matching_rules:
  name: payment_gateway_matching_rules
  version: 2
  description: "Match internal ledger with payment gateway using simplified JOIN + WHERE pattern"

  # Join: Equality only, = operator is implicit
  join:
    - left: source_a.transaction_id
      right: source_b.transaction_id

  # Rules execute in declaration order
  rules:
    # Simple comparison
    - name: currency_match
      severity: error
      description: "Currency must match exactly"
      left: source_a.currency
      operator: "="
      right: source_b.currency

    # Amount tolerance using Lua
    - name: amount_tolerance
      severity: error
      description: "Amount must match within $0.05"
      script: |
        return math.abs(source_a.amount - source_b.amount) <= 0.05

    # Fee validation using Lua (warning level)
    - name: fee_validation
      severity: warning
      description: "Validate gateway fee calculation"
      script: |
        -- Expected fee: 2.9% + $0.30
        local expected_fee = source_b.amount * 0.029 + 0.30
        local actual_fee = source_b.fee_amount or 0.00
        local diff = math.abs(expected_fee - actual_fee)

        if diff > 0.05 then
          warning(string.format("Fee mismatch: expected $%.2f, actual $%.2f", expected_fee, actual_fee))
        end

        return true  -- Warning level, always pass

    # Timestamp window using Lua (warning level)
    - name: timestamp_window
      severity: warning
      description: "Timestamps should be within 10 minutes"
      script: |
        local diff_seconds = math.abs(source_a.transaction_timestamp - source_b.transaction_timestamp)
        local diff_minutes = diff_seconds / 60

        if diff_minutes > 10 then
          warning(string.format("Timestamp difference: %.1f minutes", diff_minutes))
        end

        return true  -- Warning level, always pass

---
# Reconciliation Job (Version 2.0)
reconciliation:
  name: daily_payment_gateway_reconciliation
  version: 2
  description: "Daily reconciliation: Internal Ledger vs Payment Gateway"

  mode: one_to_one  # Only one-to-one supported

  # Reconciliation unit (preconfigured - defines how to subdivide dateTimeRange)
  reconciliation_unit:
    interval: day  # Process daily intervals
    timezone: UTC  # Only UTC supported

  # Runtime execution passes dateTimeRange (start inclusive, end exclusive):
  # Example: --datetime-range 2024-03-15T00:00:00Z/2024-03-16T00:00:00Z

  schedule:
    enabled: true
    cron: "0 9 * * *"  # Daily at 9 AM UTC
    timezone: UTC
    auto_generate_range: yesterday  # Auto-generate dateTimeRange for yesterday

  source_a:
    datasource: internal_ledger:1
    schema: payment_transaction_schema:2

  source_b:
    datasource: payment_gateway_api:1
    schema: payment_transaction_schema:2

  matching_rules: payment_gateway_matching_rules:2

  duplicate_handling:
    check_duplicates: true
    action: error

  outputs:
    matched:
      store: true
      export:
        format: csv  # CSV only
        path: /reconciliation/payment-gateway/{year}/{month}/matched_{year}{month}{day}.csv

      # Named queries for match groups
      queries:
        - name: perfect_matches
          description: "All rules passed"
          rules_passed: [currency_match, amount_tolerance, fee_validation, timestamp_window]

        - name: fee_warnings
          description: "Fee calculation warnings"
          rules_passed: [currency_match, amount_tolerance, timestamp_window]
          rules_failed: [fee_validation]

        - name: timestamp_warnings
          description: "Timestamp outside 10-minute window"
          rules_passed: [currency_match, amount_tolerance, fee_validation]
          rules_failed: [timestamp_window]

        - name: all_warnings
          description: "Any warnings present"
          rules_failed: [fee_validation, timestamp_window]

    unmatched_left:
      store: true
      export:
        format: csv  # CSV only
        path: /reconciliation/payment-gateway/{year}/{month}/unmatched_ledger_{year}{month}{day}.csv

    unmatched_right:
      store: true
      export:
        format: csv  # CSV only
        path: /reconciliation/payment-gateway/{year}/{month}/unmatched_gateway_{year}{month}{day}.csv

  notifications:
    on_completion:
      - type: email
        recipients:
          - finance_team@company.com
        subject: "Payment Reconciliation Complete - {date}"
        template: reconciliation_complete

    on_failure:
      - type: email
        recipients:
          - ops_team@company.com
        subject: "Payment Reconciliation Failed - {date}"
        template: reconciliation_failed
        severity: critical

    on_low_match_rate:
      threshold: 0.95
      recipients:
        - finance_controller@company.com
      subject: "Low Match Rate Alert - {date}"

  metadata:
    owner: finance_operations@company.com
    created_at: 2024-01-15T10:00:00Z
    updated_at: 2024-03-01T14:30:00Z
