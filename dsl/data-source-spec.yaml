---
# ============================================================================
# API with Nested JSON Response
# ============================================================================
datasource:
  name: payment_api_nested
  type: api
  version: 1
  description: "API with nested JSON response"

  connection:
    base_url: https://api.gateway.com
    endpoint: /settlements
    method: GET
    auth_type: bearer
    auth_credentials:
      token: ${SECRET:api_token}
    query_params:
      date: "{year}-{month}-{day}"

  # Extract nested data
  response:
    data_path: response.data.settlements

  format:
    type: json
    array_path: null  # Already extracted via data_path
    flatten_nested: true
    nested_separator: "."

---
# ============================================================================
# Complete Data Source Example with All Options
# ============================================================================
datasource:
  name: production_ledger
  version: 3
  type: database
  description: |
    Production ledger database - primary source for reconciliation

    Owner: Finance Operations Team
    SLA: 99.9% uptime
    Data Availability: Daily at 08:00 UTC

  # Metadata
  created_at: 2024-01-15T10:00:00Z
  created_by: john.doe@company.com
  updated_at: 2024-03-01T14:30:00Z
  updated_by: jane.smith@company.com

  # Changelog
  changelog:
    - version: 3
      date: 2024-03-01
      changes: "Updated to version 2.0 spec (UTC only, no incremental)"
      author: jane.smith@company.com

    - version: 2
      date: 2024-02-01
      changes: "Added connection pool configuration"
      author: john.doe@company.com

    - version: 1
      date: 2024-01-15
      changes: "Initial data source configuration"
      author: john.doe@company.com

  connection:
    database_type: postgresql
    host: prod-ledger-db.company.com
    port: 5432
    database: ledger
    schema: public
    username: recon_readonly
    password: ${SECRET:prod_ledger_password}
    ssl_enabled: true
    connection_pool:
      min_size: 5
      max_size: 20
      idle_timeout_seconds: 300

  query_template: |
    SELECT
      transaction_id,
      merchant_id,
      amount,
      currency,
      status,
      transaction_type,
      created_at,  -- UTC
      updated_at,  -- UTC
      metadata
    FROM transactions
    WHERE DATE(created_at AT TIME ZONE 'UTC') = '{year}-{month}-{day}'
      AND status IN ('COMPLETED', 'SETTLED')
      AND is_deleted = false
