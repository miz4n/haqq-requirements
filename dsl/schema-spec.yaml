# Schema DSL Specification
# Version: 2.0
# This file defines the YAML schema for data schema and normalization configurations
# Based on requirements/04-schema-normalization.md
#
# Key Changes:
# - All transformations use Lua scripts (no specialized configs for enum mapping, type conversion, etc.)
# - Removed type inference (moved to plugins)
# - Removed aggregation derived fields (not supported)
# - Simplified field spec: source (optional) + transform (optional Lua)

---
# ============================================================================
# Basic Schema Definition
# ============================================================================
schema:
  # Required: Unique schema name
  name: payment_transaction_schema

  # Required: Schema version
  version: 1

  # Optional: Description
  description: "Normalized schema for payment gateway transactions"

  # Required: Field definitions
  fields:
    # Direct mapping - no transformation
    - name: transaction_id
      type: string
      required: true
      source: txn_id
      description: "Unique transaction identifier"

    # Type conversion using Lua
    - name: amount
      type: decimal
      precision: 19
      scale: 4
      required: true
      source: txn_amount
      transform: "tonumber(value)"
      description: "Transaction amount"

    - name: currency
      type: string
      required: true
      source: txn_currency
      description: "ISO 4217 currency code"

    # Timestamp with Lua transformation
    - name: created_at
      type: timestamp
      required: true
      source: created_at_str
      transform: |
        return parse_timestamp(value, "YYYY-MM-DDTHH:mm:ss.SSSZ", "UTC")
      description: "Transaction creation timestamp"

    - name: merchant_id
      type: string
      required: false
      source: merchant_ref
      description: "Merchant identifier"

---
# ============================================================================
# Schema with Enum Mapping (Using Lua)
# ============================================================================
schema:
  name: normalized_status_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: txn_id

    # Enum mapping using Lua
    - name: status
      type: string
      source: txn_status
      transform: |
        -- Normalize status codes
        local v = string.upper(value or "")
        if v == "SUCCESS" or v == "OK" or v == "APPROVED" or v == "SETTLED" then
          return "COMPLETED"
        elseif v == "FAILED" or v == "ERROR" or v == "DECLINED" then
          return "REJECTED"
        elseif v == "PENDING" or v == "PROCESSING" then
          return "IN_PROGRESS"
        else
          return "UNKNOWN"
        end
      description: "Normalized transaction status"

---
# ============================================================================
# Schema with Derived Fields (Using Lua)
# ============================================================================
schema:
  name: enriched_transaction_schema
  version: 1

  fields:
    # Base fields
    - name: transaction_id
      type: string
      source: txn_id

    - name: gross_amount
      type: decimal
      precision: 19
      scale: 4
      source: amount
      transform: "tonumber(value)"

    - name: fee_amount
      type: decimal
      precision: 19
      scale: 4
      source: fee
      transform: "tonumber(value)"

    - name: transaction_date
      type: date
      source: txn_date

    # Derived field - calculation
    - name: net_amount
      type: decimal
      precision: 19
      scale: 4
      transform: "row.gross_amount - row.fee_amount"
      description: "Amount after fees"

    # Derived field - boolean logic
    - name: is_high_value
      type: boolean
      transform: "row.gross_amount >= 10000"
      description: "True if transaction is high value"

    # Derived field - complex Lua logic
    - name: calculated_fee
      type: decimal
      precision: 19
      scale: 4
      transform: |
        local amount = row.gross_amount
        if amount <= 100 then
          return 2.50
        elseif amount <= 1000 then
          return 5.00
        else
          return amount * 0.005  -- 0.5%
        end
      description: "Calculated expected fee"

    # Derived field - string manipulation
    - name: transaction_year
      type: string
      transform: "string.sub(row.transaction_id, 1, 4)"
      description: "Year extracted from transaction ID"

    # Derived field - date arithmetic
    - name: estimated_settlement_date
      type: date
      transform: "add_days(row.transaction_date, 2)"
      description: "Estimated settlement date (T+2)"

---
# ============================================================================
# Schema with Conditional Enum Mapping (Using Lua)
# ============================================================================
schema:
  name: conditional_status_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: txn_id

    - name: transaction_type
      type: string
      source: type

    # Conditional enum mapping using Lua
    - name: status
      type: string
      source: raw_status
      transform: |
        local status = string.upper(value or "")
        local txn_type = row.transaction_type or ""

        if txn_type == "REFUND" then
          if status == "SUCCESS" then
            return "REFUND_COMPLETED"
          elseif status == "FAILED" then
            return "REFUND_FAILED"
          else
            return "REFUND_" .. status
          end
        elseif txn_type == "PAYMENT" then
          if status == "SUCCESS" then
            return "PAYMENT_COMPLETED"
          elseif status == "FAILED" then
            return "PAYMENT_FAILED"
          else
            return "PAYMENT_" .. status
          end
        else
          -- Default mapping
          if status == "SUCCESS" then
            return "COMPLETED"
          elseif status == "FAILED" then
            return "FAILED"
          else
            return status
          end
        end
      description: "Status with transaction type prefix"

---
# ============================================================================
# Schema with Number Parsing (Using Lua)
# ============================================================================
schema:
  name: european_number_format_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    # Parse European number format (comma as decimal, period as thousands)
    - name: amount
      type: decimal
      precision: 19
      scale: 4
      source: amount_str
      transform: |
        -- European format: 1.234.567,89 -> 1234567.89
        local str = value or ""
        -- Remove thousands separator (.)
        str = string.gsub(str, "%.", "")
        -- Replace decimal separator (,) with (.)
        str = string.gsub(str, ",", ".")
        return tonumber(str)
      description: "Amount parsed from European format"

---
# ============================================================================
# Schema with Date Parsing (Using Lua)
# ============================================================================
schema:
  name: multi_format_date_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    # Parse date from DD/MM/YYYY format
    - name: transaction_date
      type: date
      source: date_str
      transform: |
        return parse_date(value, "DD/MM/YYYY")
      description: "Transaction date parsed from DD/MM/YYYY"

    # Parse timestamp from custom format and convert timezone
    - name: created_at
      type: timestamp
      source: created_at_nyc
      transform: |
        -- Parse from America/New_York timezone and convert to UTC
        return parse_timestamp(value, "YYYY-MM-DD HH:mm:ss", "America/New_York")
      description: "Created timestamp in UTC"

---
# ============================================================================
# Schema with Boolean Parsing (Using Lua)
# ============================================================================
schema:
  name: boolean_parsing_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    # Parse boolean from various string representations
    - name: is_active
      type: boolean
      source: active_flag
      transform: |
        local v = string.upper(value or "")
        if v == "Y" or v == "YES" or v == "1" or v == "TRUE" then
          return true
        elseif v == "N" or v == "NO" or v == "0" or v == "FALSE" then
          return false
        else
          return nil  -- NULL for invalid values
        end
      description: "Active flag parsed from string"

---
# ============================================================================
# Schema with NULL Handling (Using Lua)
# ============================================================================
schema:
  name: null_handling_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    # Handle NULL values with default
    - name: fee_amount
      type: decimal
      precision: 19
      scale: 4
      source: fee
      transform: |
        if value == nil or value == "" or value == "NULL" then
          return 0.00
        else
          return tonumber(value)
        end
      description: "Fee amount (defaults to 0.00 if NULL)"

    # Nullable field
    - name: notes
      type: string
      source: transaction_notes
      transform: |
        if value == nil or value == "" then
          return nil  -- Keep as NULL
        else
          return value
        end
      description: "Transaction notes (nullable)"

---
# ============================================================================
# Schema with Nested Field Flattening
# ============================================================================
schema:
  name: flattened_json_schema
  version: 1
  description: "Schema for flattening nested JSON data"

  fields:
    # Top-level field
    - name: transaction_id
      type: string
      source: id

    # Nested field using dot notation
    - name: amount
      type: decimal
      precision: 19
      scale: 4
      source: payment.amount.value
      transform: "tonumber(value)"

    - name: currency
      type: string
      source: payment.amount.currency

    # Multiple levels of nesting
    - name: merchant_id
      type: string
      source: merchant.details.id

    - name: merchant_name
      type: string
      source: merchant.details.name

    - name: merchant_city
      type: string
      source: merchant.location.city

---
# ============================================================================
# Schema with Constant Fields
# ============================================================================
schema:
  name: enriched_with_constants_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    - name: amount
      type: decimal
      precision: 19
      scale: 4
      source: amount
      transform: "tonumber(value)"

    # Constant field
    - name: source_system
      type: string
      transform: "return 'PAYMENT_GATEWAY'"
      description: "Source system identifier (constant)"

    # Constant with logic
    - name: region
      type: string
      transform: |
        -- Determine region based on currency
        if row.currency == "USD" or row.currency == "CAD" then
          return "NORTH_AMERICA"
        elseif row.currency == "EUR" or row.currency == "GBP" then
          return "EUROPE"
        else
          return "OTHER"
        end
      description: "Geographic region based on currency"

---
# ============================================================================
# Schema with String Manipulation
# ============================================================================
schema:
  name: string_manipulation_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    # Trim whitespace
    - name: merchant_name
      type: string
      source: merchant_name_raw
      transform: |
        return string.gsub(value or "", "^%s*(.-)%s*$", "%1")  -- Trim
      description: "Merchant name (trimmed)"

    # Uppercase
    - name: currency
      type: string
      source: currency_code
      transform: "string.upper(value or '')"
      description: "Currency code (uppercase)"

    # Lowercase
    - name: email
      type: string
      source: customer_email
      transform: "string.lower(value or '')"
      description: "Customer email (lowercase)"

    # Substring
    - name: country_code
      type: string
      source: phone_number
      transform: "string.sub(value or '', 1, 3)"
      description: "Country code from phone number"

    # Replace
    - name: masked_card
      type: string
      source: card_number
      transform: |
        local card = value or ""
        -- Mask all but last 4 digits
        if #card >= 4 then
          local last4 = string.sub(card, -4)
          return string.rep("*", #card - 4) .. last4
        else
          return string.rep("*", #card)
        end
      description: "Masked card number"

---
# ============================================================================
# Schema with Cross-Field Logic
# ============================================================================
schema:
  name: cross_field_logic_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    - name: gross_amount
      type: decimal
      precision: 19
      scale: 4
      source: gross
      transform: "tonumber(value)"

    - name: discount_percent
      type: decimal
      precision: 5
      scale: 2
      source: discount
      transform: "tonumber(value)"

    # Calculated discount amount
    - name: discount_amount
      type: decimal
      precision: 19
      scale: 4
      transform: |
        return row.gross_amount * (row.discount_percent / 100)
      description: "Calculated discount amount"

    # Net amount after discount
    - name: net_amount
      type: decimal
      precision: 19
      scale: 4
      transform: |
        return row.gross_amount - row.discount_amount
      description: "Net amount after discount"

    # Complex multi-field calculation
    - name: total_with_tax
      type: decimal
      precision: 19
      scale: 4
      source: subtotal
      transform: |
        local subtotal = tonumber(value)
        local tax = tonumber(row.tax_amount or 0)
        local tip = tonumber(row.tip_amount or 0)
        return subtotal + tax + tip
      description: "Total including tax and tip"

---
# ============================================================================
# Complete Schema Example with Multiple Patterns
# ============================================================================
schema:
  name: complete_payment_schema
  version: 1
  description: "Complete payment gateway schema with all transformation patterns"

  # Metadata
  created_at: 2024-01-15T10:00:00Z
  created_by: john.doe@company.com
  updated_at: 2024-03-01T14:30:00Z
  updated_by: jane.smith@company.com

  # Changelog
  changelog:
    - version: 1
      date: 2024-01-15
      changes: "Initial schema with Lua-based transformations"
      author: john.doe@company.com

  fields:
    # Direct mapping
    - name: transaction_id
      type: string
      required: true
      source: txn_id
      description: "Unique transaction identifier"

    # Type conversion
    - name: amount
      type: decimal
      precision: 19
      scale: 4
      required: true
      source: txn_amount
      transform: "tonumber(value)"
      description: "Transaction amount"

    # Enum mapping
    - name: status
      type: string
      required: true
      source: txn_status
      transform: |
        local v = string.upper(value or "")
        if v == "SUCCESS" or v == "OK" or v == "SETTLED" then
          return "COMPLETED"
        elseif v == "FAILED" or v == "ERROR" or v == "DECLINED" then
          return "REJECTED"
        elseif v == "PENDING" or v == "PROCESSING" then
          return "IN_PROGRESS"
        else
          return "UNKNOWN"
        end
      description: "Normalized status"

    # String normalization
    - name: currency
      type: string
      required: true
      source: currency_code
      transform: "string.upper(value or '')"
      description: "Currency code (uppercase)"

    # Timestamp parsing
    - name: created_at
      type: timestamp
      required: true
      source: created_timestamp
      transform: |
        return parse_timestamp(value, "YYYY-MM-DDTHH:mm:ss.SSSZ", "UTC")
      description: "Transaction creation timestamp"

    # Nested field extraction
    - name: merchant_id
      type: string
      source: merchant.id
      description: "Merchant identifier"

    - name: merchant_name
      type: string
      source: merchant.name
      transform: |
        return string.gsub(value or "", "^%s*(.-)%s*$", "%1")  -- Trim
      description: "Merchant name"

    # Nullable with default
    - name: fee_amount
      type: decimal
      precision: 19
      scale: 4
      source: fee
      transform: |
        if value == nil or value == "" then
          return 0.00
        else
          return tonumber(value)
        end
      description: "Fee amount (defaults to 0.00)"

    # Derived field - calculation
    - name: net_amount
      type: decimal
      precision: 19
      scale: 4
      transform: "row.amount - row.fee_amount"
      description: "Net amount after fees"

    # Derived field - conditional
    - name: is_high_value
      type: boolean
      transform: "row.amount >= 10000"
      description: "High value transaction flag"

    # Derived field - complex logic
    - name: risk_category
      type: string
      transform: |
        local amount = row.amount
        local is_international = row.currency ~= "USD"

        if amount >= 50000 then
          return "HIGH"
        elseif amount >= 10000 then
          return is_international and "MEDIUM_HIGH" or "MEDIUM"
        elseif amount >= 1000 then
          return is_international and "MEDIUM" or "LOW"
        else
          return "LOW"
        end
      description: "Risk category based on amount and currency"

    # Constant field
    - name: source_system
      type: string
      transform: "return 'PAYMENT_GATEWAY_API'"
      description: "Source system identifier"

---
# ============================================================================
# Schema Versioning Example
# ============================================================================
schema:
  name: evolving_payment_schema
  version: 3
  description: "Schema that has evolved over time"

  # Version metadata
  created_at: 2024-01-15T10:00:00Z
  created_by: john.doe@company.com
  updated_at: 2024-03-01T14:30:00Z
  updated_by: jane.smith@company.com

  # Changelog
  changelog:
    - version: 3
      date: 2024-03-01
      changes: "Added merchant_category field with conditional logic"
      author: jane.smith@company.com
      breaking: false

    - version: 2
      date: 2024-02-01
      changes: "Changed status enum mapping to include new statuses"
      author: jane.smith@company.com
      breaking: false

    - version: 1
      date: 2024-01-15
      changes: "Initial schema"
      author: john.doe@company.com
      breaking: false

  fields:
    - name: transaction_id
      type: string
      source: id

    - name: merchant_category
      type: string
      source: merchant.mcc
      transform: |
        -- Map MCC code to category
        local mcc = tonumber(value or "0")
        if mcc >= 5000 and mcc < 6000 then
          return "RETAIL"
        elseif mcc >= 7000 and mcc < 8000 then
          return "SERVICES"
        elseif mcc >= 4000 and mcc < 5000 then
          return "TRANSPORTATION"
        else
          return "OTHER"
        end
      description: "Merchant category from MCC code"
      added_in_version: 3

---
# ============================================================================
# Schema Validation (Cross-Field)
# ============================================================================
schema:
  name: validated_transaction_schema
  version: 1

  fields:
    - name: transaction_id
      type: string
      source: id

    - name: gross_amount
      type: decimal
      precision: 19
      scale: 4
      source: gross
      transform: "tonumber(value)"

    - name: fee_amount
      type: decimal
      precision: 19
      scale: 4
      source: fee
      transform: "tonumber(value)"

    - name: net_amount
      type: decimal
      precision: 19
      scale: 4
      source: net
      transform: "tonumber(value)"

    - name: transaction_date
      type: date
      source: txn_date

    - name: settlement_date
      type: date
      source: settle_date

  # Cross-field validation using Lua
  validation_rules:
    - name: net_equals_gross_minus_fee
      script: |
        local calculated_net = row.gross_amount - row.fee_amount
        return math.abs(calculated_net - row.net_amount) < 0.01
      error_message: "Net amount does not equal gross - fee"

    - name: settlement_after_transaction
      script: |
        return row.settlement_date >= row.transaction_date
      error_message: "Settlement date must be on or after transaction date"
