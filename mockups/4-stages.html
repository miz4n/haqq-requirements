<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4: Stages & Rules - Reconciliation Engine</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/steps.css">
  <link rel="stylesheet" href="css/blocks.css">
</head>
<body class="step-page">
  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">R</div>
          <span>Reconciliation Engine</span>
        </div>
        <nav>
          <ul class="main-nav">
            <li><a href="index.html" class="active">Create</a></li>
            <li><a href="#">Jobs</a></li>
            <li><a href="#">Results</a></li>
            <li><a href="#">Settings</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Progress Stepper -->
  <div class="container mt-3">
    <div class="progress-stepper">
      <div class="stepper-container">
        <div class="step completed">
          <div class="step-number">1</div>
          <div class="step-label">Recon Unit</div>
        </div>
        <div class="step completed">
          <div class="step-number">2</div>
          <div class="step-label">Data Sources</div>
        </div>
        <div class="step completed">
          <div class="step-number">3</div>
          <div class="step-label">Schema</div>
        </div>
        <div class="step active">
          <div class="step-number">4</div>
          <div class="step-label">Stages & Rules</div>
        </div>
        <div class="step">
          <div class="step-number">5</div>
          <div class="step-label">Review</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container-wide">
      <!-- Stages Card -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Reconciliation Stages</h2>
          <p class="card-subtitle">Define multi-stage reconciliation workflow with matching rules</p>
        </div>
        <div class="card-body" style="padding: 0;">
          <!-- Stage Tabs -->
          <div class="stage-tabs" id="stage-tabs">
            <!-- Rendered by StagesManager -->
          </div>

          <!-- Stage Content -->
          <div id="stage-content">
            <!-- Rendered by StagesManager -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Action Bar -->
  <div class="action-bar">
    <div class="container">
      <div class="action-bar-content">
        <button class="btn btn-secondary" id="backBtn">
          ← Back
        </button>
        <div style="display: flex; gap: var(--spacing-md);">
          <button class="btn btn-outline" id="saveDraftBtn">
            Save Draft
          </button>
          <button class="btn btn-primary" id="nextBtn">
            Next: Review →
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/block-rule-engine.js"></script>
  <script src="js/block-drag-drop.js"></script>
  <script src="js/stages-manager.js"></script>
  <script src="js/yaml-generator.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Initialize stages manager
    const stagesManager = new StagesManager({
      containerId: 'stage-content',
      tabsId: 'stage-tabs',
      onStateChange: (state) => {
        Storage.update('stages', state.stages);
      }
    });

    // Load existing config
    const config = Storage.get();

    // Check if previous steps are complete
    // Support both new format (schemas array) and old format (schemaA/schemaB)
    const hasSchemas = (config.schemas && config.schemas.length >= 2 &&
                        config.schemas[0].fields && config.schemas[0].fields.length > 0) ||
                       (config.schemaA && config.schemaA.fields && config.schemaA.fields.length > 0);

    if (!hasSchemas) {
      document.querySelector('.card-body').innerHTML = `
        <div class="alert alert-warning" style="margin: var(--spacing-lg);">
          <div class="alert-title">Schema Not Configured</div>
          Please complete Step 3 (Schema Configuration) before configuring stages and rules.
          <div class="mt-3">
            <a href="3-schema.html" class="btn btn-primary">Go to Schema Configuration</a>
          </div>
        </div>
      `;
    } else {
      // Initialize with config
      stagesManager.initialize(config);
    }

    // Validation
    App.validateCurrentStep = function() {
      // Validate stages
      const errors = stagesManager.validate();
      if (errors.length > 0) {
        App.showNotification(errors[0], 'error');
        return false;
      }

      // Save final state
      const finalConfig = stagesManager.getConfiguration();
      Storage.update('stages', finalConfig.stages);

      App.showNotification('Stages and rules saved successfully!', 'success');
      return true;
    };
  </script>
</body>
</html>
